{% extends "base.html" %}
{% block title %}Support{% endblock %}
{% set active_tab = 'support' %}
{% block content %}
<div class="main-card mb-4">
    <h4 class="fw-bold mb-3" style="color: #ff7700;">A.I Support Ticket</h4>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label fw-semibold small">Subject</label>
            <input type="text" name="subject" class="form-control" required>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold small">Message</label>
            <textarea name="message" class="form-control" rows="3" required></textarea>
        </div>
        <button type="submit" class="btn btn-orange w-100 py-3">Submit Ticket</button>
    </form>
</div>
{% endblock %}
