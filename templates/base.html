<!-- Profile Dropdown Menu -->
<div class="dropdown">
    <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle" id="profileDropdown" data-bs-toggle="dropdown" aria-expanded="false">
        <div class="rounded-circle text-white d-flex align-items-center justify-content-center fw-bold shadow-sm" style="width: 40px; height: 40px; background: linear-gradient(135deg, #ff7700, #ff5500); font-size: 1.1rem;">
            {{ user.username[0]|upper if user and user.username else 'A' }}
        </div>
    </a>
    <ul class="dropdown-menu dropdown-menu-end shadow border-0 rounded-4 p-2 mt-2" aria-labelledby="profileDropdown" style="min-width: 200px;">
        <li class="px-3 py-2 border-bottom mb-2">
            <span class="d-block small text-muted">Signed in as</span>
            <span class="fw-bold text-dark">{{ user.username if user else 'Member' }}</span>
        </li>
        <li>
            <a class="dropdown-item rounded-3 py-2 d-flex align-items-center gap-2 text-dark fw-medium" href="{{ url_for('add_funds') }}">
                <i class="fas fa-wallet text-warning"></i> Add Funds
            </a>
        </li>
        <li>
            <a class="dropdown-item rounded-3 py-2 d-flex align-items-center gap-2 text-dark fw-medium" href="#">
                <i class="fas fa-cog text-secondary"></i> Settings
            </a>
        </li>
        <li>
            <a class="dropdown-item rounded-3 py-2 d-flex align-items-center gap-2 text-dark fw-medium" href="{{ url_for('signup') }}">
                <i class="fas fa-user-plus text-primary"></i> Add Another Account
            </a>
        </li>
        <li><hr class="dropdown-divider my-2"></li>
        <li>
            <a class="dropdown-item rounded-3 py-2 d-flex align-items-center gap-2 text-danger fw-bold bg-danger bg-opacity-10" href="{{ url_for('logout') }}">
                <i class="fas fa-sign-out-alt"></i> Log Out
            </a>
        </li>
    </ul>
</div>
