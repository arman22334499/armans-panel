{% extends "base.html" %}
{% block title %}New Order{% endblock %}
{% set active_tab = 'dashboard' %}
{% block content %}
<div class="card p-4 p-md-5">
    <h4 class="mb-4 text-dark fw-bold"><i class="fas fa-cart-plus text-primary me-2"></i> New Order</h4>
    <form method="POST">
        <div class="mb-3">
            <label class="form-label fw-semibold">Service Category & Name</label>
            <select name="service_id" id="serviceSelect" class="form-select" onchange="calculateTotal()" required>
                {% for s in services %}
                <option value="{{ s.id }}" data-rate="{{ s.rate }}">[{{ s.category }}] {{ s.name }} - Rs. {{ s.rate }} per 1000</option>
                {% endfor %}
            </select>
        </div>
        <div class="mb-3">
            <label class="form-label fw-semibold">Target Link</label>
            <input type="url" name="link" class="form-control" placeholder="https://..." required>
        </div>
        <div class="mb-4">
            <label class="form-label fw-semibold">Quantity</label>
            <input type="number" name="quantity" id="quantityInput" class="form-control" value="1000" min="10" oninput="calculateTotal()" required>
        </div>
        <div class="mb-4 p-3 bg-light rounded-3 border d-flex justify-content-between align-items-center">
            <span class="text-muted fw-semibold">Total Charge:</span>
            <span class="text-success fs-4 fw-bold" id="totalCost">Rs. 0.00</span>
        </div>
        <button type="submit" class="btn btn-primary w-100 py-3 fw-bold shadow-sm">Place Order</button>
    </form>
</div>
<script>
    function calculateTotal() {
        var select = document.getElementById('serviceSelect');
        var qty = document.getElementById('quantityInput').value;
        var selectedOption = select.options[select.selectedIndex];
        var rate = parseFloat(selectedOption.getAttribute('data-rate')) || 0;
        var total = (qty * rate) / 1000.0;
        document.getElementById('totalCost').innerText = 'Rs. ' + total.toFixed(2);
    }
    window.onload = calculateTotal;
</script>
{% endblock %}
