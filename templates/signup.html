<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Arman's Panel</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1e1e2f 0%, #11111d 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .signup-card {
            width: 100%;
            max-width: 420px;
            padding: 35px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div class="signup-card">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary"><i class="fa-solid fa-user-plus text-success"></i> Create Account</h3>
            <p class="text-muted small">Arman's Panel par apna naya account banayein</p>
        </div>
        
        {% if error %}
        <div class="alert alert-danger py-2 small text-center" role="alert">{{ error }}</div>
        {% endif %}

        <form action="/signup" method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold">Username</label>
                <input type="text" class="form-control" name="username" placeholder="Apna naam likhein" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Email Address</label>
                <input type="email" class="form-control" name="email" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Password</label>
                <input type="password" class="form-control" name="password" placeholder="••••••••" required>
            </div>
            <div class="mb-3">
                <label class="form-label small fw-bold">Confirm Password</label>
                <input type="password" class="form-control" name="confirm_password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-success w-100 py-2 mb-3 shadow-sm"><i class="fa-solid fa-check"></i> Create Account</button>
        </form>

        <div class="text-center mt-3">
            <small class="text-muted">Pehle se account hai? <a href="/login" class="text-decoration-none fw-bold">Sign In karein</a></small>
        </div>
    </div>
</body>
</html>
