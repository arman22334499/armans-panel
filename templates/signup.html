<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Pakistani SMM Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4 shadow-sm w-100 mx-3" style="max-width: 400px; border-radius: 20px; border: none;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-success">📝 Create Account</h3>
        </div>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold small">Username</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold small">Email Address</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold small">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-success w-100 py-3 fw-bold rounded-3 shadow-sm">Sign Up</button>
        </form>
        <div class="text-center mt-3">
            <a href="/login" class="text-decoration-none small text-secondary">Already have an account? Login</a>
        </div>
    </div>
</body>
</html>
