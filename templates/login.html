<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pakistani SMM Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">
    <div class="card p-4 shadow-sm w-100 mx-3" style="max-width: 400px; border-radius: 20px; border: none;">
        <div class="text-center mb-4">
            <h3 class="fw-bold" style="color: #ff7700;">⚡ Pakistani SMM Panel</h3>
            <p class="text-muted small">Sign in to your account</p>
        </div>
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-semibold small">Email or Username</label>
                <input type="text" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold small">Password</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn w-100 py-3 text-white fw-bold rounded-3 shadow-sm" style="background: #ff7700;">Sign In</button>
        </form>
        <div class="text-center mt-3">
            <a href="/signup" class="text-decoration-none small fw-semibold" style="color: #ff7700;">Create new account</a>
        </div>
    </div>
</body>
</html>
